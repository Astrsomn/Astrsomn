<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流程编辑器 - 导航栏设计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }

        .nav-primary-icon {
            transition: all 0.2s ease;
        }
        
        .nav-primary-icon:hover {
            transform: translateY(-2px);
            filter: brightness(0.9);
        }

        .nav-primary-icon.active {
            box-shadow: 0 0 0 2px white, 0 0 0 4px #3b82f6;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .category-item {
            transition: background-color 0.2s;
        }

        .category-item:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- 第一层：图标导航 (Primary Sidebar) -->
    <div class="w-16 bg-white border-r flex flex-col items-center py-6 gap-6 z-20 shadow-sm">
        <!-- Logo/Home -->
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white mb-4 cursor-pointer shadow-lg shadow-blue-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        </div>

        <!-- 流程 (Active) -->
        <div class="nav-primary-icon active w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center cursor-pointer" title="流程设计">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
        </div>

        <!-- 知识库 -->
        <div class="nav-primary-icon w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center cursor-pointer" title="知识库">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </div>

        <!-- 插件 -->
        <div class="nav-primary-icon w-10 h-10 bg-green-50 text-green-600 rounded-xl flex items-center justify-center cursor-pointer" title="组件中心">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
            </svg>
        </div>

        <div class="mt-auto pb-4">
             <div class="w-10 h-10 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center overflow-hidden cursor-pointer hover:border-blue-400">
                <span class="text-xs font-bold text-gray-600">Admin</span>
             </div>
        </div>
    </div>

    <!-- 第二层：内容列表 (Secondary Navigation) -->
    <div class="w-64 bg-white border-r flex flex-col z-10 shadow-sm">
        <!-- 头部操作 -->
        <div class="p-4 border-b">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">流程导航</h2>
            <div class="relative">
                <input type="text" placeholder="搜索流程..." class="w-full bg-gray-100 border-none rounded-lg py-2 pl-9 pr-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3 top-2.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <!-- 列表内容 -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-2">
            <!-- 分类：最近使用 -->
            <div class="mb-4">
                <div class="px-3 py-2 text-xs font-bold text-gray-400 uppercase tracking-wider flex justify-between items-center">
                    <span>最近使用</span>
                    <button class="hover:text-blue-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                    </button>
                </div>
                <div class="space-y-1">
                    <div class="category-item px-3 py-2.5 rounded-lg flex items-center cursor-pointer group bg-blue-50 border border-blue-100">
                        <div class="w-2 h-2 rounded-full bg-green-500 mr-3"></div>
                        <span class="text-sm font-medium text-blue-700 truncate">数据清洗工作流</span>
                    </div>
                    <div class="category-item px-3 py-2.5 rounded-lg flex items-center cursor-pointer group">
                        <div class="w-2 h-2 rounded-full bg-gray-300 mr-3 group-hover:bg-green-400"></div>
                        <span class="text-sm text-gray-600 truncate">自动化邮件回复</span>
                    </div>
                </div>
            </div>

            <!-- 分类：业务流程 -->
            <div class="mb-4">
                <div class="px-3 py-2 text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center cursor-pointer hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                    <span>业务流程分类</span>
                </div>
                <div class="pl-2 space-y-1 mt-1 border-l ml-4 border-gray-100">
                    <div class="category-item px-3 py-2 rounded-lg flex items-center cursor-pointer group">
                        <span class="text-sm text-gray-600">销售线索跟进</span>
                        <span class="ml-auto text-[10px] bg-gray-100 px-1.5 py-0.5 rounded text-gray-400">4</span>
                    </div>
                    <div class="category-item px-3 py-2 rounded-lg flex items-center cursor-pointer group">
                        <span class="text-sm text-gray-600">财务报销审批</span>
                    </div>
                    <div class="category-item px-3 py-2 rounded-lg flex items-center cursor-pointer group">
                        <span class="text-sm text-gray-600">人力资源入职</span>
                    </div>
                </div>
            </div>
            
            <!-- 分类：测试用例 -->
            <div class="mb-4">
                <div class="px-3 py-2 text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center cursor-pointer hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                    <span>实验室 / 测试</span>
                </div>
            </div>
        </div>

        <!-- 底部快速操作 -->
        <div class="p-4 border-t bg-gray-50">
            <button class="w-full bg-white border border-gray-200 hover:border-blue-500 hover:text-blue-600 text-gray-600 py-2 px-4 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                新建流程
            </button>
        </div>
    </div>

    <!-- 主画布内容 (Canvas area) -->
    <div class="flex-1 relative bg-slate-50 flex items-center justify-center">
        <!-- 模拟背景网格 -->
        <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <div class="text-center">
            <div class="w-24 h-24 bg-white rounded-3xl shadow-sm border border-gray-100 flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </div>
            <p class="text-gray-400 font-medium">请从左侧选择一个流程开始编辑</p>
        </div>
    </div>

</body>
</html>
