# Publishes SNAPSHOT jars to GitHub Packages using profile github-packages-release
# (same eight modules as deploy-all.bat). Expects this Maven reactor at the repository root.

name: Publish SNAPSHOT to GitHub Packages

on:
  push:
    branches:
      - release
    paths:
      - 'pom.xml'
      - '**/pom.xml'
      - '**/*.java'
      - '.github/workflows/publish-github-packages.yml'
  workflow_dispatch:

concurrency:
  group: publish-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>github-astrsomn</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy SNAPSHOT artifacts
        run: mvn -B -ntp deploy -DskipTests -Pgithub-packages-release
