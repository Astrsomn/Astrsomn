spring:
  application:
    name: astrsomn-server
  profiles:
    # 默认使用 mysql 环境，用户只需修改 application-mysql.yml 中数据库连接信息即可启动
    active: h2
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 130MB
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    locations: classpath:db/migration
server:
  port: 4481
astrsomn:
  # runtime-starter：数据源 + MyBatis 自动配置总开关（false 时需自行提供 DataSource 等 Bean）
  enabled: true
  env-code: PRO
  username: admin
  admin-users: admin
  storage:
    type: local
    default-platform: local-plus
    vec-doc-biz-type: vec-doc
    base-path: astrsomn/
dromara:
  x-file-storage:
    default-platform: local-plus
    local-plus:
      - platform: local-plus
        enable-storage: true
        domain: http://127.0.0.1:${server.port}/
        base-path: ${astrsomn.storage.base-path}
        path-patterns: /file/**
        storage-path: ./storage/
    amazon-s3-v2:
      - platform: cloudflare-r2
        enable-storage: ${R2_ENABLE_STORAGE:false}
        access-key: ${R2_ACCESS_KEY_ID:${MINIO_ACCESS_KEY:}}
        secret-key: ${R2_SECRET_ACCESS_KEY:${MINIO_SECRET_KEY:}}
        end-point: ${R2_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
        bucket-name: ${R2_BUCKET:${MINIO_BUCKET:astrsomn}}
        region: ${R2_REGION:${MINIO_REGION:auto}}
        base-path: ${astrsomn.storage.base-path}
logging:
  level:
    com.astrsomn.starter.mapper: debug
    root: info
  logback:
    rollingpolicy:
      max-file-size: 10MB
  file:
    name: ./log/file
cookie:
  default-path: "/"
  default-max-age: 604800
jwt:
  secret: MIIBtzCCASwGByqGSM44BAEwggEfAoGBAP1/U4EddRIpUt9KnC7s5Of2EbdSPO9E
  expiration: 86400000
