spring:
  application:
    name: astrsomn-server
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 130MB

server:
  port: 4481

astrsomn:
  env-code: PRO
  username: admin
  admin-users: admin
  storage:
    base-path: astrsomn/
  mybatis-plus:
    additional-mapper-locations: classpath*:mapper/*.xml

dromara:
  x-file-storage:
    default-platform: local-plus
    local-plus:
      - platform: local-plus
        enable-storage: true
        domain: http://127.0.0.1:${server.port}/
        base-path: ${astrsomn.storage.base-path}
        path-patterns: /file/**
        storage-path: ./storage/
    amazon-s3-v2:
      - platform: cloudflare-r2
        enable-storage: ${STORAGE_S3_ENABLE:false}
        access-key: ${STORAGE_S3_ACCESS_KEY:}
        secret-key: ${STORAGE_S3_SECRET_KEY:}
        end-point: ${STORAGE_S3_ENDPOINT:}
        bucket-name: ${STORAGE_S3_BUCKET:astrsomn}
        region: ${STORAGE_S3_REGION:auto}
        base-path: ${astrsomn.storage.base-path}

jwt:
  secret: MIIBtzCCASwGByqGSM44BAEwggEfAoGBAP1/U4EddRIpUt9KnC7s5Of2EbdSPO9E
  expiration: 86400000

logging:
  level:
    com.astrsomn: debug
    root: info
  logback:
    rollingpolicy:
      max-file-size: 10MB
  file:
    name: ./log/astrsomn.log
