spring:
  application:
    name: astrsomn-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.astrsomn.astrsomnserver.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 数据源配置
spring:
  datasource:
    dynamic:
      primary: master
      datasources:
        master:
          url: jdbc:mysql://localhost:3306/astrsomn?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver

# Redis配置
spring:
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

