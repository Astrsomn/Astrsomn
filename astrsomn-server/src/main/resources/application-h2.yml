astrsomn:
  storage:
    type: local
    default-platform: local-plus
  mybatis-plus:
    # workflow-starter 默认会自动补这个包；这里显式写出便于排查与覆盖
    additional-type-aliases-package: com.astrsomn.workflow.core.domain.entity
  data-base:
    database-type: h2
    driver: org.h2.Driver
    # 修改说明：
    # 1. 设置 DATABASE_TO_UPPER=FALSE 以避免大小写和关键字问题
    # 2. 保持 MODE=MySQL 兼容模式
    url: jdbc:h2:file:E:/Project/astrsomn/astrsomn-launcher/distribution/windows/database/astro_ai;MODE=MySQL;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    connection-timeout: 30000
    maximum-pool-size: 10
    minimum-idle: 5